[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "harness-lens"
version = "0.0.1"
description = "Python SDK for inspecting coding-agent harness files."
readme = "README.md"
requires-python = ">=3.10"
license = "MPL-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Cristian Camargo Filho" }]
keywords = ["agents", "developer-tools", "harness", "linting"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=9.1.1,<10"]
dev = ["build>=1.3", "maturin>=1.15,<2", "pytest>=9.1.1,<10", "twine>=6"]

[project.scripts]
harness-lens = "harness_lens.cli:main"

[project.urls]
Homepage = "https://github.com/harness-lens/sdk"
Documentation = "https://github.com/harness-lens/sdk#readme"
Issues = "https://github.com/harness-lens/sdk/issues"
Repository = "https://github.com/harness-lens/sdk"

[tool.maturin]
manifest-path = "rust/crates/harness-lens-python/Cargo.toml"
python-source = "src"
module-name = "harness_lens._native"
bindings = "pyo3"

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
