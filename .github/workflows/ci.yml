name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
jobs:
  typescript:
    runs-on: ubuntu-latest
    strategy:
      matrix: { node-version: [20, 22, 24] }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: "${{ matrix.node-version }}" }
      - name: Bootstrap unpublished core
        run: |
          git clone --depth 1 https://github.com/harness-lens/core.git ../harness-lens-core
          npm --prefix ../harness-lens-core install
          npm pack ../harness-lens-core --pack-destination "$GITHUB_WORKSPACE"
          npm install --no-save "$GITHUB_WORKSPACE/harness-lens-core-0.0.1.tgz"
      - run: npm test
      - run: npm run check
      - run: npm pack --dry-run

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy, rustfmt }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: rust }
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  python:
    runs-on: ubuntu-latest
    strategy:
      matrix: { python-version: ["3.10", "3.14"] }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "${{ matrix.python-version }}" }
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install --disable-pip-version-check -e ".[test]"
      - run: python -m compileall -q src tests
      - run: python -m pytest
      - run: python -m harness_lens --version
